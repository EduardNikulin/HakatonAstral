<!doctype html>
<!--
  Блок: HTML-каркас страницы. Это ЕДИНСТВЕННЫЙ html-файл приложения.
  React-код монтируется внутрь <div id="root"> — весь интерфейс живёт там.
-->
<html lang="ru">
  <head>
    <meta charset="UTF-8" />                          <!-- кириллица в текстах не должна ломаться -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" /> <!-- корректный масштаб на телефонах -->
    <title>HakatonAstral</title>                      <!-- заголовок вкладки браузера -->
  </head>
  <body>
    <div id="root"></div>                             <!-- сюда main.jsx вставит всё React-приложение -->
    <script type="module" src="/src/main.jsx"></script> <!-- точка загрузи: браузер выполняет этот JS -->
  </body>
</html>
